name: WhatsApp templates

on:
  pull_request:
    branches: [main]

jobs:
  database:
    name: WhatsApp RLS and rollback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql
      - run: bash scripts/test-sql-whatsapp-templates.sh

  browser:
    name: WhatsApp mobile and desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config e2e/whatsapp-templates.config.ts
        env:
          SHOT_DIR: work/whatsapp-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-mobile-desktop
          path: |
            test-results/
            work/whatsapp-screenshots/
          retention-days: 14
